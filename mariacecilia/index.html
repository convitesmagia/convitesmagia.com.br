<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Cecilia 4 anos</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
}

/* páginas */
.page {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}

.page.active {
    display: flex;
    opacity: 1;
}

img, video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* clique invisível */
#start {
    position: absolute;
    inset: 0;
    cursor: pointer;
}

/* tela abrir */
.bg {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    cursor: pointer;
}

.bg-preload {
    background-image: url('abrir.png');
    display: none; 
}
</style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<div style="display: none;">
    <img src="pagina3.png" alt="Pré-carregamento">
    <img src="capa.png" alt="Pré-carregamento">
</div>


<div id="p1" class="page active">
    <img src="capa.png">
    <div id="start"></div>
</div>

<div id="p2" class="page">
    <video id="video" playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<div id="p3" class="page">
    <div class="bg" id="abrir" style="background-image:url('abrir.png')"></div>
</div>

<div id="p4" class="page">
    <img src="pagina3.png">
</div>

<div class="bg-preload"></div>

<script>
const audio = document.getElementById('bgMusic');
const video = document.getElementById('video');
const pages = document.querySelectorAll('.page');

function show(n) {
    pages.forEach(p => {
        if (p.classList.contains('active')) {
            p.classList.remove('active');
        }
    });

    setTimeout(() => {
        pages.forEach(p => {
            p.style.display = 'none';
        });

        const nextPage = document.getElementById('p' + n);
        if (nextPage) {
            nextPage.style.display = 'flex';
            requestAnimationFrame(() => {
                 nextPage.classList.add('active');
            });
        }
    }, 10);
}

/* CLIQUE ÚNICO – DESBLOQUEIA ÁUDIO + VÍDEO */
document.getElementById('start').addEventListener('click', () => {

    // AJUSTE: Abaixa o volume da música para o vídeo aparecer
    audio.volume = 0.2; 
    audio.play().catch(error => console.error("Erro áudio:", error));

    show(2);

    // Garante que o vídeo não está mudo e toca
    video.muted = false;
    video.play().catch(error => console.error("Erro vídeo:", error));

}, { once:true });

/* FINAL DO VÍDEO */
video.onended = () => {
    // AJUSTE: Aumenta o volume da música novamente quando o vídeo acaba
    audio.volume = 1.0;
    show(3); 
};

/* ABRIR PDF */
document.getElementById('abrir').onclick = () => {
    window.open('pagina3.pdf', '_blank');
    show(4);
};
</script>

<div style="display: none !important; visibility: hidden; pointer-events: none;" aria-hidden="true">
    © 2026 Cristiane Oliveira. Todos os direitos reservados. 
</div>

</body>
</html>
