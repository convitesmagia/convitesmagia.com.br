<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Cecilia 4 anos</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
}
.page {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}
.page.active {
    display: flex;
    opacity: 1;
}
img, video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
#start {
    position: absolute;
    inset: 0;
    cursor: pointer;
}
.bg {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    cursor: pointer;
}
</style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<div id="p1" class="page active">
    <img src="capa.png">
    <div id="start"></div>
</div>

<div id="p2" class="page">
    <video id="video" playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<div id="p3" class="page">
    <div class="bg" id="abrir" style="background-image:url('abrir.png')"></div>
</div>

<div id="p4" class="page">
    <img src="pagina3.png">
</div>

<script>
const audio = document.getElementById('bgMusic');
const video = document.getElementById('video');
const pages = document.querySelectorAll('.page');

function show(n) {
    pages.forEach(p => {
        p.classList.remove('active');
        setTimeout(() => { p.style.display = 'none'; }, 500);
    });

    setTimeout(() => {
        const nextPage = document.getElementById('p' + n);
        if (nextPage) {
            nextPage.style.display = 'flex';
            setTimeout(() => { nextPage.classList.add('active'); }, 50);
        }
    }, 550);
}

// 1. INÍCIO: Ativa áudio baixo e muda para o vídeo
document.getElementById('start').addEventListener('click', () => {
    audio.volume = 0.2; // Volume baixo (20%) durante o vídeo
    audio.play().catch(e => console.error("Erro áudio:", e));
    
    show(2);
    
    video.currentTime = 0;
    video.play().catch(e => console.error("Erro vídeo:", e));
}, { once: true });

// 2. FIM DO VÍDEO: Sobe o volume da música e vai para a próxima tela
video.onended = () => {
    audio.animate({ volume: 1.0 }, 1000); // Transição suave para volume máximo
    audio.volume = 1.0; 
    show(3);
};

// 3. NAVEGAÇÃO FINAL: A música continua tocando
document.getElementById('abrir').onclick = () => {
    window.open('pagina3.pdf', '_blank');
    show(4);
};
</script>

</body>
</html>
