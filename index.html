<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convites com Magia</title>

  <!-- Estilo básico -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      max-width: 420px;
      width: 90%;
      padding: 30px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #7a3cff;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
    }

    .btn-whatsapp:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.6);
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Convites com Magia ✨</h1>
    <p>
      Seja bem-vindo(a)!<br>
      Aqui você encontra convites interativos, criativos e cheios de encanto
      para tornar seus momentos inesquecíveis.
    </p>

    <a
      class="btn-whatsapp"
      href="https://wa.me/5524981183115"
      target="_blank"
    >
      💬 Falar no WhatsApp
    </a>

    <footer>
      © Convites com Magia
    </footer>
  </div>

</body>
</html>
